<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>TrekNest - Book Verified Treks Across India</title>
    <meta name="description" content="Compare verified treks across India and book in one place. Solo or group, trekking made simple. Verified organisers, transparent pricing, and 70+ destinations." />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').reduce(function(o, s) {
            var idx = s.indexOf('=');
            o[decodeURIComponent(s.slice(0, idx))] = decodeURIComponent(s.slice(idx + 1).replace(/~and~/g, '&'));
            return o;
          }, {});
          if (decoded.p !== undefined) {
            window.history.replaceState(
              null, null,
              l.pathname.slice(0, -1) + (decoded.p ? '/' + decoded.p : '') +
              (decoded.q ? '?' + decoded.q : '') + l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-surface-page text-content font-sans antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
